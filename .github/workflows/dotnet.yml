name: .NET Release

on: push

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore NbtStudio.sln
    - name: Test
      run: dotnet test NbtStudioTests\NbtStudioTests.csproj --configuration Release --no-restore
    - name: Publish (framework-dependent)
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Publish-All.ps1 -NoPause
    - name: Publish (self-contained)
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Publish-SelfContained.ps1 -NoPause
    - name: Package
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Package-All.ps1 -Items win-x64,win-x86,win-arm64,source -NoPause
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NbtStudio-archives
        path: Archives/*.zip
        if-no-files-found: error
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Archives/*.zip
